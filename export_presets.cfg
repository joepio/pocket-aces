[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="*.html,*.css,*.js"
exclude_filter="tests/*,README.md,sdk-source.json"
export_path="dist/windows/PocketAces.exe"

[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
codesign/enable=false
application/modify_resources=false

[preset.1]
name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="*.html,*.css,*.js"
exclude_filter="tests/*,README.md,sdk-source.json"
export_path="dist/linux/PocketAces.x86_64"

[preset.1.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
