name: Publish GameNight preview
on:
  workflow_run:
    workflows: [Pocket Aces]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  upload:
    if: vars.GAMENIGHT_PUBLISH_ENABLED == 'true'
    uses: ontola/gamenight/.github/workflows/publish-game.yml@488258365a7fe55df3fd7677ca85b513980db492
    secrets: inherit
    with:
      artifact: pocket-aces-windows
      game: pocket-aces
      file: pocket-aces-windows.zip
      entrypoint: PocketAces.exe
