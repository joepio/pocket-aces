<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b30"><title>Pocket Aces · Your hand</title><link rel="stylesheet" href="phone.css"></head>
<body><main>
<header><span class="brand">POCKET ACES <small>THE ROOFTOP CLUB</small></span><span id="connection" role="status">Connecting</span></header>
<section class="identity"><h1 id="name">Your seat</h1><span id="chips">Waiting for the table</span></section>
<div id="notice" role="status" aria-live="polite"></div>
<section id="hand" aria-label="Your private hand"><div class="card back">◆</div><div class="card back">◆</div></section>
<p class="private">Just between you and the table.</p>
<section class="table-info"><span id="street">Take a seat in GameNight</span><strong id="pot">POT 0</strong></section>
<div id="board" aria-label="Community cards"></div>
<h2 id="turn">Waiting for your hand…</h2><p id="result"></p>
<section id="actions" hidden aria-label="Poker actions">
<div class="buttons"><button id="fold" class="quiet">Fold</button><button id="match" class="primary">Check</button></div>
<section id="raising" hidden><label for="amount">Raise to <output id="amount-label">0</output></label><input id="amount" type="range" step="1" min="0" max="1000"><div class="presets"><button id="minimum">Min</button><button id="half">½ pot</button><button id="pot-raise">Pot</button><button id="allin">All in</button></div><button id="raise" class="raise">Raise to 0</button></section>
</section>
<footer>Texas Hold’em · Fictional chips only</footer>
</main><script src="/assets/companion.js"></script><script src="phone.js"></script></body></html>
